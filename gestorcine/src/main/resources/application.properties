spring.application.name=gestorcine

# Cambiar usuario y contrasena segun tu instalacion de MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/cineflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Credenciales del admin que se crea automaticamente al arrancar si no
# existe (ver AdminBootstrap.java). Opcional: si no las poner, usa
# admin/1234 por defecto.
admin.usuario=admin
admin.contrasena=1234
